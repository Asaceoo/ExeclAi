<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <rect width="880" height="360" fill="#f8fafc"/>
  <text x="440" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">写操作自动自检闭环（fail-closed）</text>

  <rect x="50" y="90" width="150" height="70" rx="10" fill="#0ea5e9"/>
  <text x="125" y="120" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1. AI 发起写入</text>
  <text x="125" y="140" text-anchor="middle" font-size="10" fill="#e0f2fe">write / pivot / chart…</text>

  <rect x="250" y="90" width="150" height="70" rx="10" fill="#f59e0b"/>
  <text x="325" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2. 前置守卫</text>
  <text x="325" y="136" text-anchor="middle" font-size="10" fill="#fffbeb">保护态探测·确认门</text>

  <rect x="450" y="90" width="150" height="70" rx="10" fill="#8b5cf6"/>
  <text x="525" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3. 执行 + 快照</text>
  <text x="525" y="136" text-anchor="middle" font-size="10" fill="#f3e8ff">before/after 落 SQLite</text>

  <rect x="650" y="90" width="150" height="70" rx="10" fill="#10b981"/>
  <text x="725" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4. verify_* 回读</text>
  <text x="725" y="136" text-anchor="middle" font-size="10" fill="#d1fae5">行守恒·对账·格式核验</text>

  <path d="M 725 160 L 725 210 L 560 210" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
  <path d="M 460 210 L 125 210 L 125 160" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="6 3" marker-end="url(#bad)"/>
  <rect x="480" y="192" width="130" height="36" rx="8" fill="#dcfce7"/>
  <text x="545" y="215" text-anchor="middle" font-size="11" fill="#166534">verdict 达标 → 报告用户</text>
  <rect x="210" y="192" width="150" height="36" rx="8" fill="#fee2e2"/>
  <text x="285" y="215" text-anchor="middle" font-size="11" fill="#991b1b">不达标 → 自动修正/重做</text>
  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#475569">自检判定无期望值时 fail-closed，绝不静默放行；全程操作历史可回滚，运行日志全量留痕</text>
</svg>
